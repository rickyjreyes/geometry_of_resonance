name: Sync canonical audit totals

on:
  push:
    branches:
      - agent/sync-master-audit-totals

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-master-audit-totals
      - name: Update stale 59/27 totals
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = [
              Path('WCT_MASTER_EQUATIONS_UPDATED.md'),
              Path('README.md'),
              Path('READING_ORDER.md'),
              Path('EQUATIONS.md'),
              Path('MASTER_EQUATIONS.md'),
          ]
          replacements = [
              (r'59\ \mathrm{PASS} + 27\ \mathrm{CONDITIONAL} + 26\ \mathrm{DEFINITION} + 30\ \mathrm{OPEN} + 0\ \mathrm{FAIL}',
               r'68\ \mathrm{PASS} + 18\ \mathrm{CONDITIONAL} + 26\ \mathrm{DEFINITION} + 30\ \mathrm{OPEN} + 0\ \mathrm{FAIL}'),
              ('59 PASS + 27 CONDITIONAL + 26 DEFINITION + 30 OPEN + 0 FAIL',
               '68 PASS + 18 CONDITIONAL + 26 DEFINITION + 30 OPEN + 0 FAIL'),
              ('59 PASS', '68 PASS'),
              ('27 CONDITIONAL', '18 CONDITIONAL'),
          ]
          changed=[]
          for p in candidates:
              if not p.exists():
                  continue
              text=p.read_text(encoding='utf-8')
              new=text
              for old,repl in replacements:
                  new=new.replace(old,repl)
              if new != text:
                  p.write_text(new,encoding='utf-8')
                  changed.append(str(p))
          if not changed:
              raise SystemExit('No stale canonical totals found')
          print('updated:', ', '.join(changed))
          PY
      - name: Commit synchronized totals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WCT_MASTER_EQUATIONS_UPDATED.md README.md READING_ORDER.md EQUATIONS.md MASTER_EQUATIONS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Synchronize canonical audit totals to 68 PASS'
          git push origin HEAD:agent/sync-master-audit-totals
