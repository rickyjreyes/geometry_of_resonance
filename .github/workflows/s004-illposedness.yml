name: S004 variable-coefficient ill-posedness checks

on:
  pull_request:
    paths:
      - "derivations/s004_illposedness_verify.py"
      - "derivations/test_s004_illposedness.py"
      - "audit/s004_closure/illposedness_verification.json"
      - "docs/s004_closure/**"
      - ".github/workflows/s004-illposedness.yml"
  push:
    branches: [main]
    paths:
      - "derivations/s004_illposedness_verify.py"
      - "derivations/test_s004_illposedness.py"
      - "audit/s004_closure/illposedness_verification.json"
      - ".github/workflows/s004-illposedness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned symbolic and numerical dependencies
        run: python -m pip install sympy==1.14.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.16.2
      - name: Recompute I1-I8 (exact symbolic checks, end-to-end localized beam, refinement, negative controls)
        run: python derivations/s004_illposedness_verify.py --output /tmp/s004-illposed-current.json > /dev/null
      - name: Unit tests
        run: python -m unittest -v derivations.test_s004_illposedness
      - name: Compare exact fields and numerical verdicts with the committed receipt
        run: |
          python - <<'EOF'
          import json
          new = json.load(open("/tmp/s004-illposed-current.json"))
          old = json.load(open("audit/s004_closure/illposedness_verification.json"))
          exact = ["I1_linearization_structure", "I3_exact_beam_1d", "I5_conjugation", "I8_bookkeeping"]
          bad = [k for k in exact if new[k] != old[k]]
          for key in ("factorization", "dP/dlam at lam=w|xi|"):
              if new["I2_hadamard_root"][key] != old["I2_hadamard_root"][key]:
                  bad.append(f"I2 {key}")
          i4n = {k: v for k, v in new["I4_exact_beam_phase"].items() if k.startswith("d=")}
          i4o = {k: v for k, v in old["I4_exact_beam_phase"].items() if k.startswith("d=")}
          if i4n != i4o:
              bad.append("I4_exact_beam_phase")
          if new["source_sha256"] != old["source_sha256"]:
              bad.append("source_sha256")
          i7 = new["I7_end_to_end_wkb"]
          for name, run in i7.items():
              if isinstance(run, dict) and "verdict" in run and not all(run["verdict"].values()):
                  bad.append(f"I7 verdict {name}")
          for name, c in i7["negative controls (B1 lower-order terms)"].items():
              if c["contradiction_produced"]:
                  bad.append(f"I7 control {name}")
          if bad:
              raise SystemExit(f"Phase XXXIII receipt mismatch: {bad}")
          print("PASS: exact fields reproduce the committed receipt; all I7 verdicts hold; all negative controls fail as required")
          EOF
      - name: Publish receipt
        uses: actions/upload-artifact@v4
        with:
          name: s004-illposedness-receipt
          path: /tmp/s004-illposed-current.json
          if-no-files-found: error
