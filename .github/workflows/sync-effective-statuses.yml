name: Sync effective WCT statuses

on:
  push:
    branches: [main]
    paths:
      - "WCT_FULL_EQUATION_LIST_CORRECTED.md"
      - "scripts/sync_effective_statuses.py"
      - ".github/workflows/sync-effective-statuses.yml"
  pull_request:
    paths:
      - "WCT_FULL_EQUATION_LIST_CORRECTED.md"
      - "scripts/sync_effective_statuses.py"
      - ".github/workflows/sync-effective-statuses.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  WCT_SYMPY_REF: ${{ github.event_name == 'pull_request' && 'compiled-registry-v2' || 'main' }}

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - name: Generate effective statuses and provenance
        id: generate
        shell: bash
        run: |
          set +e
          python scripts/sync_effective_statuses.py > status-sync.log 2>&1
          code=$?
          cat status-sync.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload synchronization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effective-status-sync-diagnostics
          path: status-sync.log
      - name: Stop on synchronization failure
        if: steps.generate.outputs.exit_code != '0'
        run: exit 1
      - name: Upload canonical registry preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: effective-canonical-registry-preview
          path: WCT_FULL_EQUATION_LIST_CORRECTED.md
      - name: Commit synchronized canonical registry
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add WCT_FULL_EQUATION_LIST_CORRECTED.md
          if git diff --cached --quiet; then
            echo "Canonical registry is current."
            exit 0
          fi
          git commit -m "Synchronize canonical effective statuses"
          git push
