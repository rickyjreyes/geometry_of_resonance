name: Foundational D4 and SM v18 handoff audits

on:
  pull_request:
    paths:
      - "audit/d4_handoff/**"
      - "SM_Spectrum/**"
      - "docs/D4_CANONICAL_EVIDENCE_MAP.md"
      - "docs/SM_V18_SPECTRAL_BRIDGE_AUDIT.md"
      - ".github/workflows/foundational-handoff.yml"
  push:
    branches: [main]
    paths:
      - "audit/d4_handoff/**"
      - "SM_Spectrum/**"
      - "docs/D4_CANONICAL_EVIDENCE_MAP.md"
      - "docs/SM_V18_SPECTRAL_BRIDGE_AUDIT.md"
      - ".github/workflows/foundational-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4-scoped-status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate provenance and status promotion gates
        run: python audit/d4_handoff/validate_claims.py

  sm-v18-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install versioned numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.16.2
      - name: Run unchanged-source in-sample audit
        run: python SM_Spectrum/audit_v18.py --output audit/v18_baseline.json
      - name: Check output scope and optimizer diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("audit/v18_baseline.json").read_text())
          assert x["classification"]=="EMPIRICAL_FIT_ONLY" and x["no_holdout"] is True
          assert x["nonzero_target_count"]==11 and len(x["per_target"])==12
          assert len(x["source_sha256"])==64
          assert x["optimizer"]["method"]=="L-BFGS-B"
          assert len(x["two_free_parameter_jacobian"]["columns"])==2
          print("SM v18 SCOPED BASELINE CHECK: PASS")
          PY
      - name: Preserve baseline report without claiming independent prediction
        uses: actions/upload-artifact@v4
        with:
          name: sm-v18-insample-audit-${{ github.sha }}
          path: audit/v18_baseline.json
          if-no-files-found: error
