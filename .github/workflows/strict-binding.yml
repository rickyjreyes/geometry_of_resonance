name: Strict binding and whole-space compactness

on:
  pull_request:
    paths:
      - "derivations/strict_binding.py"
      - "derivations/test_strict_binding.py"
      - "docs/strict_binding/**"
      - "audit/strict_binding/**"
      - ".github/workflows/strict-binding.yml"
  push:
    branches: [main]
    paths:
      - "derivations/strict_binding.py"
      - "derivations/test_strict_binding.py"
      - "docs/strict_binding/**"
      - "audit/strict_binding/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binding-proofs-and-recorded-d4-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned mathematical dependencies
        run: python -m pip install sympy==1.14.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.16.2
      - name: Preserve both inherited manifests and validate the new claim boundary
        run: |
          python audit/foundational/validate_records.py
          python audit/foundational_recovery/validate_records.py
          python audit/strict_binding/validate_records.py
      - name: Reproduce public checks and validate recorded private-source D4 replay evidence
        run: python audit/strict_binding/reproduce.py --public-ci --output-dir /tmp/strict-binding-ci
      - name: Upload actual receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-binding-verification
          path: |
            /tmp/strict-binding-ci/*.json
            /tmp/strict-binding-ci/*.log
            /tmp/strict-binding-ci/cross_paper/symbolic_verification.json
          if-no-files-found: error
