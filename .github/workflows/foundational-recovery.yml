name: Foundational recovery and independent Hamiltonian

on:
  pull_request:
    paths:
      - "derivations/foundational_recovery.py"
      - "derivations/test_foundational_recovery.py"
      - "docs/foundational_recovery/**"
      - "audit/foundational_recovery/**"
      - ".github/workflows/foundational-recovery.yml"
  push:
    branches: [main]
    paths:
      - "derivations/foundational_recovery.py"
      - "docs/foundational_recovery/**"
      - "audit/foundational_recovery/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-reconstruction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned mathematical dependencies
        run: python -m pip install sympy==1.14.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.16.2
      - name: Check new scope and preserve all PR33 artifact hashes
        run: |
          python audit/foundational_recovery/validate_records.py
          python audit/foundational/validate_records.py
      - name: Independent reconstruction before inherited derivations
        run: |
          python derivations/foundational_recovery.py --output /tmp/recovery-current.json
          python -m unittest discover -v -s derivations -p 'test_*.py'
          python derivations/foundational_closure.py --output /tmp/pr33-current.json
      - name: Existing cross-paper identities and frozen gates
        run: |
          mkdir -p /tmp/recovery-cross-paper
          cp audit/cross_paper/verify_derivations.py /tmp/recovery-cross-paper/verify.py
          python /tmp/recovery-cross-paper/verify.py
          python audit/d4_handoff/validate_claims.py
          python audit/prospective/freeze_gate.py --self-test
          python -m unittest discover -v -s audit/prospective -p 'test_*.py'
      - name: Publish scoped verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: foundational-recovery-checks
          path: |
            /tmp/recovery-current.json
            /tmp/pr33-current.json
            /tmp/recovery-cross-paper/symbolic_verification.json
          if-no-files-found: error
