name: Frozen simulation and figure reproducibility

on:
  push:
    branches: [main]
    paths:
      - "reproducibility/**"
      - "Makefile"
      - ".github/workflows/reproducibility.yml"
  pull_request:
    paths:
      - "reproducibility/**"
      - "Makefile"
      - ".github/workflows/reproducibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: reproducibility/requirements.lock
      - name: Install exact dependencies
        run: python -m pip install --requirement reproducibility/requirements.lock
      - name: Record resolved environment
        run: python -m pip freeze | sort > reproducibility/resolved-environment.txt
      - name: Regenerate simulation and figure
        run: make reproduce
      - name: Verify expected SHA-256 values
        run: make verify
      - name: Upload deterministic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-band-reference-${{ github.sha }}
          if-no-files-found: error
          path: |
            reproducibility/artifacts/
            reproducibility/resolved-environment.txt
