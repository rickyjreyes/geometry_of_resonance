name: Frozen D4 strict binding and endpoint closure

on:
  pull_request:
    paths:
      - "derivations/d4_binding.py"
      - "derivations/test_d4_binding.py"
      - "docs/d4_binding/**"
      - "audit/d4_binding/**"
      - ".github/workflows/d4-endpoint-binding.yml"
  push:
    branches: [main]
    paths:
      - "derivations/d4_binding.py"
      - "derivations/test_d4_binding.py"
      - "docs/d4_binding/**"
      - "audit/d4_binding/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d4-binding-proof-and-recorded-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned mathematical dependencies
        run: python -m pip install sympy==1.14.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.16.2
      - name: Validate preserved evidence and proof dependencies
        run: |
          python audit/foundational/validate_records.py
          python audit/foundational_recovery/validate_records.py
          python audit/strict_binding/validate_records.py
          python audit/d4_binding/validate_records.py
      - name: Reproduce public mathematics and validate recorded private-source replay
        run: python audit/d4_binding/reproduce.py --public-ci --output-dir /tmp/d4-binding-ci
      - name: Upload actual public-scope receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d4-binding-phase-v-verification
          path: |
            /tmp/d4-binding-ci/*.json
            /tmp/d4-binding-ci/*.log
            /tmp/d4-binding-ci/cross_paper/symbolic_verification.json
          if-no-files-found: error
