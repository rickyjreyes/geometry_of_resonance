name: Fix GitHub math rendering

on:
  push:
    paths:
      - .github/workflows/fix-github-math.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize GitHub math syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("WCT_FULL_EQUATION_LIST_CORRECTED.md"),
              Path("WCT_MASTER_EQUATIONS_UPDATED.md"),
          ]

          def compact(parts):
              return " ".join(x.strip() for x in parts if x.strip())

          def normalize(text):
              def repl_paren_block(match):
                  expr = compact(match.group(1).splitlines())
                  if not expr:
                      raise ValueError("empty standalone paren block")
                  return f"$${expr}$$" + (match.group(2) or "")

              text = re.sub(
                  r"(?ms)^[ \t]*\\\([ \t]*\n(.*?)\n[ \t]*\\\)([,.]?)",
                  repl_paren_block,
                  text,
              )

              lines = text.splitlines()
              out = []
              in_fence = False
              i = 0

              while i < len(lines):
                  line = lines[i]
                  stripped = line.strip()

                  if stripped.startswith("```"):
                      in_fence = not in_fence
                      out.append(line)
                      i += 1
                      continue

                  if not in_fence and stripped in ("$$", r"\["):
                      close = "$$" if stripped == "$$" else r"\]"
                      content = []
                      i += 1
                      while i < len(lines) and lines[i].strip() != close:
                          content.append(lines[i].strip())
                          i += 1
                      if i >= len(lines):
                          raise ValueError("unclosed display block")
                      expr = compact(content)
                      if not expr:
                          raise ValueError("empty display block")
                      out.append(f"$${expr}$$")
                      i += 1
                      continue

                  if not in_fence:
                      line = line.replace(r"\[", "$$").replace(r"\]", "$$")
                      line = line.replace(r"\(", "$").replace(r"\)", "$")

                  out.append(line)
                  i += 1

              result = "\n".join(out) + ("\n" if text.endswith("\n") else "")

              for token in (r"\(", r"\)", r"\[", r"\]"):
                  if token in result:
                      raise ValueError(f"unsupported delimiter remains: {token}")

              if any(line.strip() == "$$" for line in result.splitlines()):
                  raise ValueError("standalone $$ delimiter remains")
              if "$$$$" in result:
                  raise ValueError("empty $$ block remains")

              fence = False
              for line_number, line in enumerate(result.splitlines(), 1):
                  if line.strip().startswith("```"):
                      fence = not fence
                      continue
                  if fence:
                      continue
                  remainder = re.sub(r"\$\$.*?\$\$", "", line)
                  if remainder.count("$") % 2:
                      raise ValueError(f"unbalanced inline math on line {line_number}")

              return result

          for path in files:
              original = path.read_text(encoding="utf-8")
              updated = normalize(original)
              path.write_text(updated, encoding="utf-8")
              display_count = sum(
                  len(re.findall(r"\$\$.*?\$\$", line))
                  for line in updated.splitlines()
              )
              print(f"{path}: {display_count} display equations normalized")
          PY

      - name: Commit corrected Markdown and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-github-math.yml
          git add WCT_FULL_EQUATION_LIST_CORRECTED.md WCT_MASTER_EQUATIONS_UPDATED.md
          git commit -m "Fix GitHub math delimiters in WCT equation references"
          git push
