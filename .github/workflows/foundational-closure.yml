name: Foundational closure proofs and scope

on:
  pull_request:
    paths:
      - "derivations/foundational_closure.py"
      - "derivations/test_foundational_closure.py"
      - "audit/foundational/**"
      - "docs/foundational/**"
      - ".github/workflows/foundational-closure.yml"
  push:
    branches: [main]
    paths:
      - "derivations/foundational_closure.py"
      - "audit/foundational/**"
      - "docs/foundational/**"
      - ".github/workflows/foundational-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned symbolic and numerical dependencies
        run: python -m pip install sympy==1.14.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.16.2
      - name: Check source and receipt integrity
        run: python audit/foundational/validate_records.py
      - name: Reconstruct the action and counterexamples
        run: |
          python derivations/foundational_closure.py --output /tmp/foundational-current.json
          python -m unittest -v derivations.test_gr_constants_closure derivations.test_foundational_stage2 derivations.test_spectral_circle_numeric derivations.test_ostrogradsky_witness derivations.test_foundational_closure
      - name: Replay existing full-background quadratic derivation without overwriting history
        run: |
          mkdir -p /tmp/foundational-cross-paper
          cp audit/cross_paper/verify_derivations.py /tmp/foundational-cross-paper/verify.py
          python /tmp/foundational-cross-paper/verify.py
          python audit/d4_handoff/validate_claims.py
      - name: Publish mathematical check receipts
        uses: actions/upload-artifact@v4
        with:
          name: foundational-closure-checks
          path: |
            /tmp/foundational-current.json
            /tmp/foundational-cross-paper/symbolic_verification.json
          if-no-files-found: error
