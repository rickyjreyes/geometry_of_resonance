name: Release Lean proofs

on:
  push:
    paths:
      - 'lean/**'
      - '.github/workflows/release-lean.yml'
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/release-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unsound placeholders
        shell: bash
        run: |
          if grep -REn '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' lean/ReleaseProofs; then
            echo "Found unfinished proof or axiom in release modules"
            exit 1
          fi
      - name: Install Lean via elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and build
        shell: bash
        run: |
          cd lean
          lake update
          lake exe cache get
          lake build
      - name: Verify actual S004 constraint and charge no-go theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          cd lean
          lake env lean S004RegularAxiomAudit.lean 2>&1 | tee s004-regular-axioms.log
          python3 check_s004_regular_axioms.py s004-regular-axioms.log
