name: Release Lean proofs

on:
  push:
    paths:
      - 'lean/**'
      - '.github/workflows/release-lean.yml'
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/release-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unsound placeholders
        shell: bash
        run: |
          if grep -REn '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' lean/ReleaseProofs; then
            echo "Found unfinished proof or axiom in release modules"
            exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
