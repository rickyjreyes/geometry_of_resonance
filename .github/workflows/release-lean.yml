name: Release Lean proofs

on:
  push:
    paths:
      - 'lean/**'
      - '.github/workflows/release-lean.yml'
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/release-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unsound placeholders
        shell: bash
        run: |
          if grep -REn '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' lean/ReleaseProofs; then
            echo "Found unfinished proof or axiom in release modules"
            exit 1
          fi
      - name: Install Lean via elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and build
        shell: bash
        run: |
          cd lean
          lake update
          lake exe cache get
          lake build
      - name: Audit exact R54 spectral geometry theorem axioms
        shell: bash
        run: |
          cd lean
          lake env lean R54AxiomAudit.lean | tee r54-axioms.log
          python3 - <<'PY'
          import re
          s = open('r54-axioms.log').read()
          blocks = re.findall(r'depends on axioms:\s*\[([^\]]*)\]', s)
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          bad = {a.strip() for b in blocks for a in b.split(',') if a.strip() and a.strip() not in allowed}
          assert len(blocks) == 5 and not bad and 'sorryAx' not in s, bad
          PY
      - name: Audit spectral eigenvalue interval and geometric mass enclosure
        shell: bash
        run: |
          set -euo pipefail
          cd lean
          lake env lean R54IntervalAxiomAudit.lean | tee r54-interval-axioms.log
          python3 - <<'PY'
          import re
          s = open('r54-interval-axioms.log').read()
          blocks = [line.split('depends on axioms: [', 1)[1].split(']', 1)[0]
                    for line in s.splitlines() if 'depends on axioms: [' in line]
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          assert len(blocks) == 3, f'expected 3 exact theorem roots, got {len(blocks)}'
          extra = {a.strip() for block in blocks for a in block.split(',') if a.strip() not in allowed}
          assert not extra and 'sorryAx' not in s, extra
          print('R54 interval axiom audit OK: 3 standard-only theorem roots')
          PY
      - name: Verify actual S004 constraint and charge no-go theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          cd lean
          lake env lean S004RegularAxiomAudit.lean 2>&1 | tee s004-regular-axioms.log
          python3 check_s004_regular_axioms.py s004-regular-axioms.log
