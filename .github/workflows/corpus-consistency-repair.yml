name: Repair canonical corpus consistency

on:
  push:
    branches: [main]
    paths:
      - "scripts/repair_corpus_consistency.py"
      - ".github/workflows/corpus-consistency-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Repair canonical source text
        run: python scripts/repair_corpus_consistency.py

      - name: Verify stale values are absent
        run: |
          ! grep -R "51\\\\ \\mathrm{PASS} + 32\\\\ \\mathrm{CONDITIONAL}" WCT_MASTER_EQUATIONS_UPDATED.md
          ! grep -F "-\\frac{\\nabla^2\\psi}{\\psi + \\varepsilon" README.md

      - name: Commit repaired sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add README.md WCT_MASTER_EQUATIONS_UPDATED.md
          if git diff --cached --quiet; then
            echo "No canonical repairs needed."
            exit 0
          fi
          git commit -m "Repair canonical WCT totals, operator, and dimensionality boundary"
          git push
