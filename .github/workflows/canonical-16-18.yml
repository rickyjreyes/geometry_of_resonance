name: Canonical geometry #16 #18 verification

on:
  pull_request:
    paths:
      - "lean/**"
      - "derivations/canonical_16_18_verify.py"
      - "docs/foundational/CANONICAL_FINITE_K_VERDICT_2026_10_27.md"
      - "docs/foundational/GHOST_FREE_COMPLETION_VERDICT_2026_10_27.md"
      - ".github/workflows/canonical-16-18.yml"
  push:
    paths:
      - "lean/**"
      - "derivations/canonical_16_18_verify.py"
      - ".github/workflows/canonical-16-18.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-symbolic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned SymPy
        run: python -m pip install sympy==1.14.0
      - name: Verify exact static and rotating symbols
        run: python derivations/canonical_16_18_verify.py
