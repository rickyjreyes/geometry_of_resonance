name: S004 closure symbolic and resonance certificates

on:
  pull_request:
    paths:
      - "derivations/s004_closure_verify.py"
      - "derivations/test_s004_closure.py"
      - "audit/s004_closure/**"
      - "docs/s004_closure/**"
      - ".github/workflows/s004-closure.yml"
  push:
    branches: [main]
    paths:
      - "derivations/s004_closure_verify.py"
      - "derivations/test_s004_closure.py"
      - "audit/s004_closure/**"
      - ".github/workflows/s004-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned symbolic and numerical dependencies
        run: python -m pip install sympy==1.14.0 mpmath==1.3.0 numpy==2.3.5 scipy==1.16.2
      - name: Recompute every S004 closure check (exact symbolic, resonance certificate, diagnostics)
        run: python derivations/s004_closure_verify.py --output /tmp/s004-closure-current.json
      - name: Unit tests
        run: python -m unittest -v derivations.test_s004_closure
      - name: Compare exact certificate fields with the committed receipt
        run: |
          python - <<'EOF'
          import json
          new = json.load(open("/tmp/s004-closure-current.json"))
          old = json.load(open("audit/s004_closure/verification.json"))
          exact = ["C1_principal_symbol", "C2_symbol_algebra", "C5_hadamard_exact", "C8_nodal_jets",
                   "C9_crossing_series", "C11_nodal_brackets", "C12_harmonic_forcing",
                   "C12_resonance_certificate", "C13_collision_indicial", "C15_unified_tangency"]
          bad = [k for k in exact if new[k] != old[k]]
          if new["source_sha256"] != old["source_sha256"]:
              bad.append("source_sha256")
          if bad:
              raise SystemExit(f"exact certificate fields changed: {bad}")
          print("PASS: exact certificate fields reproduce the committed receipt")
          EOF
      - name: Publish receipt
        uses: actions/upload-artifact@v4
        with:
          name: s004-closure-receipt
          path: /tmp/s004-closure-current.json
          if-no-files-found: error
